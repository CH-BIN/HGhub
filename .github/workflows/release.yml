name: Release Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  android:
    name: Android (split per ABI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 版本号提取
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="$(node -p "require('./package.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: 安装 Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          target: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Tauri Android init
        run: pnpm tauri android init

      - name: Tauri Android build
        run: pnpm tauri android build --apk --split-per-abi

      - name: 自动生成 keystore + 签名 APK
        env:
          KEY_ALIAS: upload
          STORE_PASSWORD: StorePass_123456
          KEY_PASSWORD: KeyPass_123456
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.keystore"
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"

          mkdir -p artifacts

          keytool -genkey -v \
            -keystore "$KS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Self, O=SelfDev, L=Kunming, S=Yunnan, C=CN"

          found=0
          while IFS= read -r f; do
            abi_dir="$(basename "$(dirname "$f")")"
            out="artifacts/HGhub_${VERSION}_${abi_dir}.apk"
            echo "正在签名：$f -> $out"
            "$APKSIGNER" sign \
              --ks "$KS" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --v4-signing-enabled false \
              --out "$out" "$f"
            "$APKSIGNER" verify --print-certs "$out" | head -4
            found=$((found + 1))
          done < <(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk')

          rm -f "$KS"

          if [[ "$found" -eq 0 ]]; then
            echo "::error::没有找到 release APK"
            exit 1
          fi
          ls -lh artifacts

      - name: 上传 Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
